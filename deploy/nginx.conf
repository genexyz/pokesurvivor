# nginx para dist/ (Dockerfile). Coolify/Traefik pone el HTTPS delante.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json application/manifest+json application/xml image/svg+xml text/plain;

  types { application/manifest+json webmanifest; }

  # (Cada location repite nosniff: en nginx, un add_header dentro de location
  # anula los del server.)

  # Páginas, versión y service worker: siempre se revalidan, así el aviso de
  # actualización (src/js/core/updater.js mira version.json) llega al momento.
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location = /version.json {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # El juego: cada versión lleva su huella en la URL (app.min.js?v=...).
  location /js/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # Sprites, iconos y fuentes: no cambian.
  location /assets/ {
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options nosniff always;
  }

  error_page 404 /404.html;
}
