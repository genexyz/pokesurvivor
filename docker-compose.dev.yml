# Local Postgres for testing (same major version as Coolify: 18): npm run db:up
# and in .env: DATABASE_URL=postgres://pokesurvivor:pokesurvivor@localhost:5432/pokesurvivor
# (Postgres 18 images keep their data under /var/lib/postgresql/18/...: the volume
#  is mounted at /var/lib/postgresql, not at .../data as in older versions.)
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pokesurvivor
      POSTGRES_PASSWORD: pokesurvivor
      POSTGRES_DB: pokesurvivor
    ports:
      - '5432:5432'
    volumes:
      - pgdata18:/var/lib/postgresql
volumes:
  pgdata18:
